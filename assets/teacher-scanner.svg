<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#182438" />
    </linearGradient>
    <linearGradient id="laserG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </linearGradient>
    <filter id="tcShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .t-ui { font-family: 'Inter', -apple-system, sans-serif; }
    .t-mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <rect width="1000" height="680" rx="16" fill="url(#tbg)" />

  <!-- Topbar -->
  <rect width="1000" height="56" rx="16" fill="#12213b" />
  <rect y="44" width="1000" height="12" fill="#12213b" />
  <line x1="0" y1="56" x2="1000" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <g transform="translate(32, 14)">
    <rect width="26" height="26" rx="6" fill="none" stroke="#f2a93b" stroke-width="2" />
    <circle cx="13" cy="13" r="3.5" fill="#f2a93b" />
    <text x="36" y="19" class="t-ui" font-weight="700" fill="#ffffff" font-size="15">Smart Attendance <tspan fill="#f2a93b">Teacher Scanner</tspan></text>
  </g>

  <g transform="translate(730, 14)">
    <rect width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)" />
    <text x="14" y="18" class="t-ui" font-size="12" fill="#ffffff">👤 Prof. Deba</text>
    <rect x="142" y="0" width="85" height="28" rx="14" fill="#c24444" opacity="0.85" />
    <text x="160" y="18" class="t-ui" font-size="12" fill="#ffffff" font-weight="600">Logout</text>
  </g>

  <!-- Container -->
  <g transform="translate(32, 74)">
    <!-- Header title -->
    <text x="0" y="24" class="t-mono" fill="#f2a93b" font-size="12" letter-spacing="1.5">TEACHER CONSOLE</text>
    <text x="0" y="56" class="t-ui" font-weight="800" fill="#ffffff" font-size="28">Live Attendance Viewfinder</text>
    <text x="0" y="80" class="t-ui" fill="#93a8c7" font-size="14">Point students' QR cards at the laptop webcam. Duplicates are auto-rejected.</text>

    <!-- 2 Column Layout -->
    <g transform="translate(0, 104)">
      <!-- Left: Camera & Controls -->
      <g filter="url(#tcShadow)">
        <rect width="450" height="460" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.1)" />

        <!-- Subject selection controls -->
        <g transform="translate(24, 24)">
          <text x="0" y="16" class="t-ui" font-weight="700" fill="#ffffff" font-size="14">1. Select Lecture Subject</text>
          <rect y="28" width="402" height="42" rx="8" fill="#1a2d4c" stroke="rgba(255,255,255,0.15)" />
          <text x="14" y="54" class="t-ui" fill="#ffffff" font-size="13.5">Data Structures &amp; Algorithms (CSE Sem 5)</text>
          <polygon points="380,48 390,48 385,55" fill="#f2a93b" />
        </g>

        <!-- Webcam Viewfinder Box -->
        <g transform="translate(24, 114)">
          <text x="0" y="16" class="t-ui" font-weight="700" fill="#ffffff" font-size="14">2. Live Optical Scanner</text>

          <g transform="translate(0, 28)">
            <!-- Camera viewfinder background -->
            <rect width="402" height="230" rx="10" fill="#080e18" stroke="#1f3354" stroke-width="2" />

            <!-- Simulated live classroom webcam preview background -->
            <rect x="2" y="2" width="398" height="226" rx="8" fill="#0f1b2b" />
            <circle cx="201" cy="95" r="40" fill="#182c47" />
            <path d="M 141 180 C 141 135 261 135 261 180 Z" fill="#182c47" />

            <!-- Card being held up -->
            <rect x="141" y="45" width="120" height="120" rx="6" fill="#12213b" stroke="#f2a93b" stroke-width="1.5" />
            <!-- Simulated QR on card -->
            <rect x="156" y="60" width="90" height="90" rx="4" fill="#ffffff" />
            <rect x="164" y="68" width="22" height="22" fill="#0e1a2f" />
            <rect x="216" y="68" width="22" height="22" fill="#0e1a2f" />
            <rect x="164" y="120" width="22" height="22" fill="#0e1a2f" />
            <rect x="194" y="76" width="10" height="10" fill="#0e1a2f" />
            <rect x="194" y="100" width="26" height="8" fill="#0e1a2f" />
            <rect x="200" y="120" width="16" height="16" fill="#0e1a2f" />

            <!-- Scanner Frame Reticle (Target Box) -->
            <path d="M 115 50 L 115 30 L 135 30 M 267 30 L 287 30 L 287 50 M 115 160 L 115 180 L 135 180 M 267 180 L 287 180 L 287 160" stroke="#22c55e" stroke-width="3" fill="none" />

            <!-- Laser Scanning Beam -->
            <rect x="115" y="105" width="172" height="3" fill="url(#laserG)" />

            <!-- Real-time HUD Status -->
            <rect x="12" y="12" width="130" height="24" rx="12" fill="rgba(34,197,94,0.2)" stroke="#22c55e" />
            <circle cx="24" cy="24" r="4" fill="#22c55e" />
            <text x="34" y="28" class="t-mono" fill="#86efac" font-size="11">SCANNER ACTIVE</text>
          </g>

          <!-- Camera Action button -->
          <g transform="translate(0, 276)">
            <rect width="402" height="38" rx="8" fill="#c24444" />
            <text x="160" y="24" class="t-ui" font-weight="700" fill="#ffffff" font-size="13">■ Stop Camera Scanner</text>
          </g>
        </g>
      </g>

      <!-- Right: Real-time Attendance Feed & Scan Log -->
      <g transform="translate(476, 0)">
        <!-- Today's Attendance Table -->
        <g filter="url(#tcShadow)">
          <rect width="460" height="250" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.1)" />

          <text x="24" y="32" class="t-ui" font-weight="700" fill="#ffffff" font-size="16">Today's Class Register</text>
          <!-- CSV Export Button -->
          <g transform="translate(320, 16)">
            <rect width="116" height="28" rx="6" fill="#f2a93b" />
            <text x="14" y="19" class="t-ui" font-weight="700" fill="#0e1a2f" font-size="12">⬇ Export CSV</text>
          </g>

          <!-- Table Header -->
          <g transform="translate(24, 60)">
            <rect width="412" height="30" rx="6" fill="#1a2d4c" />
            <text x="14" y="20" class="t-mono" fill="#93a8c7" font-size="11">TIME</text>
            <text x="90" y="20" class="t-mono" fill="#93a8c7" font-size="11">ROLL</text>
            <text x="160" y="20" class="t-mono" fill="#93a8c7" font-size="11">STUDENT NAME</text>
            <text x="340" y="20" class="t-mono" fill="#93a8c7" font-size="11">STATUS</text>
          </g>

          <!-- Table Rows -->
          <g transform="translate(24, 98)">
            <!-- Row 1 -->
            <rect width="412" height="34" rx="4" fill="#162640" />
            <text x="14" y="22" class="t-mono" fill="#ffd56b" font-size="12">12:27:36</text>
            <text x="90" y="22" class="t-mono" fill="#ffffff" font-size="12">89</text>
            <text x="160" y="22" class="t-ui" font-weight="600" fill="#ffffff" font-size="12">PREMENDU MANNA</text>
            <rect x="330" y="8" width="68" height="18" rx="9" fill="rgba(46,125,91,0.3)" />
            <text x="340" y="21" class="t-mono" fill="#6de2ad" font-size="10.5" font-weight="700">Present</text>

            <!-- Row 2 -->
            <g transform="translate(0, 38)">
              <rect width="412" height="34" rx="4" fill="#162640" />
              <text x="14" y="22" class="t-mono" fill="#ffd56b" font-size="12">12:28:38</text>
              <text x="90" y="22" class="t-mono" fill="#ffffff" font-size="12">21</text>
              <text x="160" y="22" class="t-ui" font-weight="600" fill="#ffffff" font-size="12">BISHAL GHOSH</text>
              <rect x="330" y="8" width="68" height="18" rx="9" fill="rgba(46,125,91,0.3)" />
              <text x="340" y="21" class="t-mono" fill="#6de2ad" font-size="10.5" font-weight="700">Present</text>
            </g>

            <!-- Row 3 -->
            <g transform="translate(0, 76)">
              <rect width="412" height="34" rx="4" fill="#162640" />
              <text x="14" y="22" class="t-mono" fill="#ffd56b" font-size="12">12:30:14</text>
              <text x="90" y="22" class="t-mono" fill="#ffffff" font-size="12">88</text>
              <text x="160" y="22" class="t-ui" font-weight="600" fill="#ffffff" font-size="12">PRANOY SAMANTA</text>
              <rect x="330" y="8" width="68" height="18" rx="9" fill="rgba(46,125,91,0.3)" />
              <text x="340" y="21" class="t-mono" fill="#6de2ad" font-size="10.5" font-weight="700">Present</text>
            </g>
          </g>
        </g>

        <!-- Live Scan Log Feed with Anti-Proxy Alert -->
        <g transform="translate(0, 268)" filter="url(#tcShadow)">
          <rect width="460" height="192" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.1)" />
          <text x="24" y="28" class="t-ui" font-weight="700" fill="#ffffff" font-size="15">Live Scan Console</text>
          <text x="350" y="28" class="t-mono" fill="#22c55e" font-size="11">● REALTIME</text>

          <g transform="translate(24, 46)">
            <!-- Success log entry -->
            <rect width="412" height="38" rx="6" fill="#132a24" stroke="#2e7d5b" stroke-width="1" />
            <text x="12" y="24" class="t-mono" fill="#86efac" font-size="12">12:30:14 · ST-88 PRANOY SAMANTA</text>
            <text x="375" y="24" class="t-mono" fill="#86efac" font-size="13">✔ OK</text>

            <!-- Duplicate rejected entry -->
            <g transform="translate(0, 44)">
              <rect width="412" height="38" rx="6" fill="#2a1618" stroke="#c24444" stroke-width="1" />
              <text x="12" y="24" class="t-mono" fill="#fca5a5" font-size="11.5">12:30:20 · ST-88 Already marked present today!</text>
              <text x="368" y="24" class="t-mono" fill="#fca5a5" font-size="13">✕ 409</text>
            </g>

            <!-- Next success -->
            <g transform="translate(0, 88)">
              <rect width="412" height="38" rx="6" fill="#132a24" stroke="#2e7d5b" stroke-width="1" />
              <text x="12" y="24" class="t-mono" fill="#86efac" font-size="12">12:31:02 · ST-201 SOUVIK DAS</text>
              <text x="375" y="24" class="t-mono" fill="#86efac" font-size="13">✔ OK</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
