<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#12213b" />
      <stop offset="100%" stop-color="#1c3156" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2a93b" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182b4a" />
      <stop offset="100%" stop-color="#0f1c31" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; fill: #ffffff; font-size: 46px; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #b8c7dd; font-size: 18px; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #ffd56b; font-weight: 700; letter-spacing: 1.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
  </g>

  <!-- Decorative Ambient Glows -->
  <circle cx="980" cy="140" r="140" fill="#f2a93b" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="380" r="160" fill="#2e7d5b" opacity="0.08" filter="url(#glow)" />

  <!-- Left Content Column -->
  <g transform="translate(80, 85)">
    <!-- Brand Mark & Eyebrow Pill -->
    <g>
      <rect x="0" y="0" width="32" height="32" rx="8" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
      <path d="M 6 0 L 0 0 L 0 6 M 26 0 L 32 0 L 32 6 M 0 26 L 0 32 L 6 32 M 32 26 L 32 32 L 26 32" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
      <circle cx="16" cy="16" r="4.5" fill="#f2a93b" />
      <rect x="46" y="2" width="230" height="28" rx="14" fill="rgba(242,169,59,0.15)" stroke="rgba(242,169,59,0.3)" stroke-width="1" />
      <text x="60" y="20" class="chip">ACADEMIC ATTENDANCE SYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Smart Attendance</text>
    <text x="0" y="130" class="title" fill="url(#amberGrad)" style="fill:url(#amberGrad);">QR-Code Powered</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Next-gen contactless attendance tracking with automated student QR badges,</text>
    <text x="0" y="198" class="subtitle">instant laptop webcam scanning, and real-time MongoDB duplicate guards.</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 235)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="145" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="14" y="20" class="mono" fill="#6de2ad">✔ Live Camera Scan</text>

      <!-- Badge 2 -->
      <rect x="155" y="0" width="138" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="169" y="20" class="mono" fill="#ffd56b">⚡ Zero Paperwork</text>

      <!-- Badge 3 -->
      <rect x="303" y="0" width="155" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="317" y="20" class="mono" fill="#93c5fd">🔒 Anti-Proxy Guard</text>

      <!-- Badge 4 -->
      <rect x="468" y="0" width="130" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="482" y="20" class="mono" fill="#c4b5fd">📊 Analytics &amp; CSV</text>
    </g>
  </g>

  <!-- Right Visual Mockup (Digital ID Card + Scanner Viewfinder) -->
  <g transform="translate(760, 45)" filter="url(#cardShadow)">
    <!-- ID Card Container -->
    <rect x="0" y="0" width="360" height="330" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="24" y="36" class="mono" fill="#f2a93b" font-size="11">CAMPUS SMART ID</text>
    <text x="24" y="56" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" font-size="15">Institute of Technology</text>
    <!-- Microchip Graphic -->
    <rect x="290" y="26" width="44" height="32" rx="5" fill="url(#amberGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="290" y1="42" x2="334" y2="42" stroke="#925608" stroke-width="1" />
    <line x1="312" y1="26" x2="312" y2="58" stroke="#925608" stroke-width="1" />

    <line x1="24" y1="72" x2="336" y2="72" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Student Info Row -->
    <g transform="translate(24, 88)">
      <!-- Student Photo Frame -->
      <rect x="0" y="0" width="70" height="70" rx="10" fill="#203456" stroke="#f2a93b" stroke-width="2" />
      <!-- Silhouette avatar -->
      <circle cx="35" cy="28" r="14" fill="#a4bcd9" />
      <path d="M 17 62 C 17 48 53 48 53 62 Z" fill="#a4bcd9" />

      <!-- Details -->
      <text x="86" y="22" font-family="'Inter', sans-serif" font-weight="800" fill="#ffffff" font-size="17">PREMENDU MANNA</text>
      <text x="86" y="42" class="mono" fill="#ffd56b" font-size="13">ROLL: ST-89 · CSE</text>
      <text x="86" y="60" font-family="'Inter', sans-serif" fill="#93a8c7" font-size="12">Semester 5 · 2026-27</text>
    </g>

    <!-- Centered QR Box with Scanner Guides -->
    <g transform="translate(115, 175)">
      <rect x="0" y="0" width="130" height="130" rx="10" fill="#ffffff" />
      <!-- Simulated QR code blocks -->
      <rect x="12" y="12" width="34" height="34" fill="#0e1a2f" rx="3" />
      <rect x="18" y="18" width="22" height="22" fill="#ffffff" rx="2" />
      <rect x="23" y="23" width="12" height="12" fill="#0e1a2f" />

      <rect x="84" y="12" width="34" height="34" fill="#0e1a2f" rx="3" />
      <rect x="90" y="18" width="22" height="22" fill="#ffffff" rx="2" />
      <rect x="95" y="23" width="12" height="12" fill="#0e1a2f" />

      <rect x="12" y="84" width="34" height="34" fill="#0e1a2f" rx="3" />
      <rect x="18" y="90" width="22" height="22" fill="#ffffff" rx="2" />
      <rect x="23" y="95" width="12" height="12" fill="#0e1a2f" />

      <!-- QR Pattern modules -->
      <rect x="54" y="14" width="8" height="8" fill="#0e1a2f" />
      <rect x="66" y="24" width="8" height="18" fill="#0e1a2f" />
      <rect x="54" y="48" width="20" height="8" fill="#0e1a2f" />
      <rect x="82" y="54" width="14" height="8" fill="#0e1a2f" />
      <rect x="52" y="66" width="12" height="12" fill="#0e1a2f" />
      <rect x="68" y="86" width="16" height="10" fill="#0e1a2f" />
      <rect x="92" y="74" width="8" height="16" fill="#0e1a2f" />
      <rect x="104" y="96" width="12" height="12" fill="#0e1a2f" />
      <rect x="54" y="104" width="24" height="8" fill="#0e1a2f" />

      <!-- Optical Viewfinder Reticle -->
      <path d="M -8 10 L -8 -8 L 10 -8 M 120 -8 L 138 -8 L 138 10 M -8 120 L -8 138 L 10 138 M 120 138 L 138 138 L 138 120" stroke="#f2a93b" stroke-width="2.5" fill="none" />
    </g>

    <!-- Scan Status Pill -->
    <g transform="translate(100, 316)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#2e7d5b" />
      <text x="22" y="16" class="mono" fill="#ffffff" font-size="11">✔ SCAN TO ATTEND</text>
    </g>
  </g>
</svg>
