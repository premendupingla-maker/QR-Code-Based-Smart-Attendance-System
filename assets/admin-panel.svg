<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#182438" />
    </linearGradient>
    <filter id="acShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .a-ui { font-family: 'Inter', -apple-system, sans-serif; }
    .a-mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <rect width="1000" height="680" rx="16" fill="url(#abg)" />

  <!-- Topbar -->
  <rect width="1000" height="56" rx="16" fill="#12213b" />
  <rect y="44" width="1000" height="12" fill="#12213b" />
  <line x1="0" y1="56" x2="1000" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <g transform="translate(32, 14)">
    <rect width="26" height="26" rx="6" fill="none" stroke="#f2a93b" stroke-width="2" />
    <circle cx="13" cy="13" r="3.5" fill="#f2a93b" />
    <text x="36" y="19" class="a-ui" font-weight="700" fill="#ffffff" font-size="15">Smart Attendance <tspan fill="#f2a93b">Admin Control Center</tspan></text>
  </g>

  <g transform="translate(730, 14)">
    <rect width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)" />
    <text x="14" y="18" class="a-ui" font-size="12" fill="#ffffff">👑 Superadmin</text>
    <rect x="142" y="0" width="85" height="28" rx="14" fill="#c24444" opacity="0.85" />
    <text x="160" y="18" class="a-ui" font-size="12" fill="#ffffff" font-weight="600">Logout</text>
  </g>

  <!-- Container -->
  <g transform="translate(32, 74)">
    <!-- Header title -->
    <text x="0" y="24" class="a-mono" fill="#f2a93b" font-size="12" letter-spacing="1.5">ADMINISTRATION</text>
    <text x="0" y="56" class="a-ui" font-weight="800" fill="#ffffff" font-size="28">Institutional Registry &amp; Analytics</text>

    <!-- Admin Tabs -->
    <g transform="translate(0, 76)">
      <!-- Tab 1: Students (Active) -->
      <rect width="120" height="34" rx="6" fill="#1e345b" stroke="#f2a93b" stroke-width="1.5" />
      <text x="22" y="22" class="a-ui" font-weight="700" fill="#ffffff" font-size="13.5">👥 Students</text>

      <!-- Tab 2: Teachers -->
      <rect x="130" width="120" height="34" rx="6" fill="#14233a" />
      <text x="152" y="22" class="a-ui" fill="#93a8c7" font-size="13.5">👨‍🏫 Teachers</text>

      <!-- Tab 3: Subjects -->
      <rect x="260" width="120" height="34" rx="6" fill="#14233a" />
      <text x="284" y="22" class="a-ui" fill="#93a8c7" font-size="13.5">📚 Subjects</text>

      <!-- Tab 4: Attendance Records -->
      <rect x="390" width="160" height="34" rx="6" fill="#14233a" />
      <text x="410" y="22" class="a-ui" fill="#93a8c7" font-size="13.5">📅 Attendance Master</text>
    </g>

    <!-- Content Area (Grid 2: Add Student / QR Preview on Top, Table Below) -->
    <g transform="translate(0, 126)">
      <!-- Left: Add/Edit Student Form -->
      <g filter="url(#acShadow)">
        <rect width="560" height="230" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.1)" />
        <text x="24" y="30" class="a-ui" font-weight="700" fill="#ffffff" font-size="16">Enroll New Student</text>

        <!-- Form fields layout -->
        <g transform="translate(24, 46)">
          <!-- Name & Roll -->
          <rect width="246" height="36" rx="6" fill="#1a2d4c" />
          <text x="12" y="23" class="a-ui" fill="#ffffff" font-size="12">PREMENDU MANNA</text>

          <rect x="264" width="246" height="36" rx="6" fill="#1a2d4c" />
          <text x="276" y="23" class="a-mono" fill="#ffd56b" font-size="12">Roll: 89</text>

          <!-- Email & Branch -->
          <rect y="46" width="246" height="36" rx="6" fill="#1a2d4c" />
          <text x="12" y="69" class="a-ui" fill="#93a8c7" font-size="12">premendu@gmail.com</text>

          <rect x="264" y="46" width="246" height="36" rx="6" fill="#1a2d4c" />
          <text x="276" y="69" class="a-ui" fill="#93a8c7" font-size="12">Computer Science · Sem 5</text>

          <!-- College & Photo upload -->
          <rect y="92" width="246" height="36" rx="6" fill="#1a2d4c" />
          <text x="12" y="115" class="a-ui" fill="#93a8c7" font-size="12">ABC College of Engineering</text>

          <rect x="264" y="92" width="246" height="36" rx="6" fill="#1a2d4c" stroke="rgba(242,169,59,0.4)" stroke-dasharray="3,3" />
          <text x="286" y="115" class="a-ui" fill="#f2a93b" font-size="12">📷 Upload Student Photo</text>

          <!-- Submit button -->
          <rect y="138" width="160" height="36" rx="8" fill="#f2a93b" />
          <text x="32" y="161" class="a-ui" font-weight="700" fill="#0e1a2f" font-size="13">Save &amp; Generate QR</text>
        </g>
      </g>

      <!-- Right: QR ID Card Preview Widget -->
      <g transform="translate(584, 0)" filter="url(#acShadow)">
        <rect width="352" height="230" rx="14" fill="#0e1a2f" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="28" class="a-mono" fill="#f2a93b" font-size="11">AUTO-GENERATED CARD PREVIEW</text>

        <g transform="translate(20, 44)">
          <!-- Mini ID Card graphic -->
          <rect width="312" height="130" rx="10" fill="#14243d" stroke="#f2a93b" stroke-width="1" />
          <rect x="14" y="14" width="46" height="46" rx="8" fill="#203456" />
          <circle cx="37" cy="32" r="10" fill="#a4bcd9" />
          <text x="70" y="28" class="a-ui" font-weight="700" fill="#ffffff" font-size="13.5">PREMENDU MANNA</text>
          <text x="70" y="44" class="a-mono" fill="#ffd56b" font-size="11">ROLL: 89</text>
          <text x="70" y="58" class="a-ui" fill="#93a8c7" font-size="10.5">CSE · Sem 5 · ABC College</text>

          <!-- QR code -->
          <rect x="236" y="14" width="62" height="62" rx="4" fill="#ffffff" />
          <rect x="242" y="20" width="14" height="14" fill="#0e1a2f" />
          <rect x="278" y="20" width="14" height="14" fill="#0e1a2f" />
          <rect x="242" y="56" width="14" height="14" fill="#0e1a2f" />
          <rect x="260" y="28" width="6" height="6" fill="#0e1a2f" />
          <rect x="260" y="44" width="12" height="6" fill="#0e1a2f" />

          <!-- Bottom chip tag -->
          <rect x="14" y="92" width="284" height="24" rx="4" fill="#0e1726" />
          <text x="24" y="108" class="a-mono" fill="#6de2ad" font-size="10.5">Payload: {"id": "89"} · Base64 Stored</text>
        </g>

        <!-- Actions -->
        <g transform="translate(20, 186)">
          <text x="0" y="16" class="a-ui" fill="#93a8c7" font-size="11.5">⚡ Base64 QR embedded automatically in MongoDB document.</text>
        </g>
      </g>

      <!-- Bottom: Master Student Table -->
      <g transform="translate(0, 246)" filter="url(#acShadow)">
        <rect width="936" height="210" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.1)" />
        <text x="24" y="30" class="a-ui" font-weight="700" fill="#ffffff" font-size="16">All Registered Students (4 Enrolled)</text>

        <!-- Table headers -->
        <g transform="translate(24, 48)">
          <rect width="888" height="30" rx="6" fill="#1a2d4c" />
          <text x="16" y="20" class="a-mono" fill="#93a8c7" font-size="11">ROLL</text>
          <text x="100" y="20" class="a-mono" fill="#93a8c7" font-size="11">NAME</text>
          <text x="290" y="20" class="a-mono" fill="#93a8c7" font-size="11">BRANCH</text>
          <text x="440" y="20" class="a-mono" fill="#93a8c7" font-size="11">SEM</text>
          <text x="520" y="20" class="a-mono" fill="#93a8c7" font-size="11">EMAIL</text>
          <text x="760" y="20" class="a-mono" fill="#93a8c7" font-size="11">ACTIONS</text>
        </g>

        <!-- Table Rows -->
        <g transform="translate(24, 86)">
          <!-- Row 1 -->
          <rect width="888" height="32" rx="4" fill="#162640" />
          <text x="16" y="21" class="a-mono" fill="#ffd56b" font-size="12">89</text>
          <text x="100" y="21" class="a-ui" font-weight="600" fill="#ffffff" font-size="12">PREMENDU MANNA</text>
          <text x="290" y="21" class="a-ui" fill="#cbd5e1" font-size="12">CSE</text>
          <text x="440" y="21" class="a-mono" fill="#cbd5e1" font-size="12">5</text>
          <text x="520" y="21" class="a-ui" fill="#93a8c7" font-size="12">premendu@gmail.com</text>
          <text x="760" y="21" class="a-ui" fill="#f2a93b" font-size="11.5">Edit · Regenerate QR · 🗑</text>

          <!-- Row 2 -->
          <g transform="translate(0, 36)">
            <rect width="888" height="32" rx="4" fill="#162640" />
            <text x="16" y="21" class="a-mono" fill="#ffd56b" font-size="12">88</text>
            <text x="100" y="21" class="a-ui" font-weight="600" fill="#ffffff" font-size="12">PRANOY SAMANTA</text>
            <text x="290" y="21" class="a-ui" fill="#cbd5e1" font-size="12">CSE</text>
            <text x="440" y="21" class="a-mono" fill="#cbd5e1" font-size="12">5</text>
            <text x="520" y="21" class="a-ui" fill="#93a8c7" font-size="12">pranoy@gmail.com</text>
            <text x="760" y="21" class="a-ui" fill="#f2a93b" font-size="11.5">Edit · Regenerate QR · 🗑</text>
          </g>

          <!-- Row 3 -->
          <g transform="translate(0, 72)">
            <rect width="888" height="32" rx="4" fill="#162640" />
            <text x="16" y="21" class="a-mono" fill="#ffd56b" font-size="12">21</text>
            <text x="100" y="21" class="a-ui" font-weight="600" fill="#ffffff" font-size="12">BISHAL GHOSH</text>
            <text x="290" y="21" class="a-ui" fill="#cbd5e1" font-size="12">CSE</text>
            <text x="440" y="21" class="a-mono" fill="#cbd5e1" font-size="12">5</text>
            <text x="520" y="21" class="a-ui" fill="#93a8c7" font-size="12">bishal@gmail.com</text>
            <text x="760" y="21" class="a-ui" fill="#f2a93b" font-size="11.5">Edit · Regenerate QR · 🗑</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
