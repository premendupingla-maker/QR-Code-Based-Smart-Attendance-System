<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#182438" />
    </linearGradient>
    <linearGradient id="heroG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12213b" />
      <stop offset="100%" stop-color="#1d345b" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2a93b" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d5b" />
      <stop offset="100%" stop-color="#43a047" />
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .ui-font { font-family: 'Inter', -apple-system, sans-serif; }
    .mono-font { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Canvas -->
  <rect width="1000" height="680" rx="16" fill="url(#sbg)" />

  <!-- Top Navigation Bar Preview -->
  <rect width="1000" height="56" rx="16" fill="#12213b" />
  <rect y="44" width="1000" height="12" fill="#12213b" />
  <line x1="0" y1="56" x2="1000" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Brand Mark -->
  <g transform="translate(32, 14)">
    <rect width="26" height="26" rx="6" fill="none" stroke="#f2a93b" stroke-width="2" />
    <circle cx="13" cy="13" r="3.5" fill="#f2a93b" />
    <text x="36" y="19" class="ui-font" font-weight="700" fill="#ffffff" font-size="15">Smart Attendance <tspan fill="#f2a93b">Portal</tspan></text>
  </g>

  <!-- User Nav Right -->
  <g transform="translate(730, 14)">
    <rect width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)" />
    <text x="14" y="18" class="ui-font" font-size="12" fill="#ffffff">👤 PREMENDU</text>
    <rect x="142" y="0" width="85" height="28" rx="14" fill="#c24444" opacity="0.85" />
    <text x="160" y="18" class="ui-font" font-size="12" fill="#ffffff" font-weight="600">Logout</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(32, 74)">

    <!-- Student Hero Greeting Banner -->
    <g filter="url(#cShadow)">
      <rect width="936" height="120" rx="14" fill="url(#heroG)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

      <!-- Avatar with glowing border -->
      <g transform="translate(24, 20)">
        <rect width="80" height="80" rx="40" fill="#203456" stroke="#f2a93b" stroke-width="3" />
        <circle cx="40" cy="32" r="16" fill="#a4bcd9" />
        <path d="M 20 70 C 20 54 60 54 60 70 Z" fill="#a4bcd9" />
        <circle cx="68" cy="68" r="8" fill="#2e7d5b" stroke="#12213b" stroke-width="2" />
      </g>

      <!-- Student Details -->
      <g transform="translate(126, 30)">
        <text x="0" y="0" class="mono-font" fill="#ffd56b" font-size="11" letter-spacing="1">WELCOME BACK,</text>
        <text x="0" y="28" class="ui-font" font-weight="800" fill="#ffffff" font-size="24">PREMENDU MANNA</text>
        <g transform="translate(0, 42)">
          <rect width="88" height="22" rx="11" fill="rgba(242,169,59,0.2)" stroke="rgba(242,169,59,0.4)" />
          <text x="10" y="15" class="mono-font" fill="#ffd56b" font-size="11" font-weight="700">ROLL: 89</text>

          <rect x="96" width="130" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
          <text x="108" y="15" class="ui-font" fill="#d1d5db" font-size="11">Computer Science</text>

          <rect x="234" width="80" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
          <text x="246" y="15" class="ui-font" fill="#d1d5db" font-size="11">Semester 5</text>

          <rect x="322" width="180" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
          <text x="334" y="15" class="ui-font" fill="#d1d5db" font-size="11">ABC College of Engineering</text>
        </g>
      </g>

      <!-- Exam Eligibility Pill -->
      <g transform="translate(710, 36)">
        <rect width="200" height="48" rx="24" fill="rgba(46,125,91,0.25)" stroke="#2e7d5b" stroke-width="1.5" />
        <circle cx="24" cy="24" r="6" fill="#43a047" />
        <text x="38" y="28" class="ui-font" font-weight="700" fill="#6de2ad" font-size="14">87.5% · Exam Eligible</text>
        <text x="38" y="42" class="ui-font" fill="#a7f3d0" font-size="10">Target &gt; 75% Satisfied</text>
      </g>
    </g>

    <!-- 4 Key Analytics Metric Cards -->
    <g transform="translate(0, 140)">
      <!-- Metric 1: Overall Score -->
      <g filter="url(#cShadow)">
        <rect width="222" height="84" rx="12" fill="#15243d" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="18" width="48" height="48" rx="10" fill="#eef3ff" opacity="0.15" />
        <text x="26" y="50" class="ui-font" font-size="24">📊</text>
        <text x="74" y="38" class="mono-font" font-weight="700" fill="#ffffff" font-size="24">87.5%</text>
        <text x="74" y="54" class="ui-font" fill="#93a8c7" font-size="11" font-weight="600">OVERALL SCORE</text>
      </g>

      <!-- Metric 2: Classes Attended -->
      <g transform="translate(238, 0)" filter="url(#cShadow)">
        <rect width="222" height="84" rx="12" fill="#15243d" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="18" width="48" height="48" rx="10" fill="rgba(46,125,91,0.2)" />
        <text x="26" y="50" class="ui-font" font-size="24">✅</text>
        <text x="74" y="38" class="mono-font" font-weight="700" fill="#6de2ad" font-size="24">28</text>
        <text x="74" y="54" class="ui-font" fill="#93a8c7" font-size="11" font-weight="600">PRESENT DAYS</text>
      </g>

      <!-- Metric 3: Total Lectures -->
      <g transform="translate(476, 0)" filter="url(#cShadow)">
        <rect width="222" height="84" rx="12" fill="#15243d" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="18" width="48" height="48" rx="10" fill="rgba(242,169,59,0.2)" />
        <text x="26" y="50" class="ui-font" font-size="24">🏫</text>
        <text x="74" y="38" class="mono-font" font-weight="700" fill="#ffd56b" font-size="24">32</text>
        <text x="74" y="54" class="ui-font" fill="#93a8c7" font-size="11" font-weight="600">TOTAL LECTURES</text>
      </g>

      <!-- Metric 4: Buffer Status -->
      <g transform="translate(714, 0)" filter="url(#cShadow)">
        <rect width="222" height="84" rx="12" fill="#15243d" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="18" width="48" height="48" rx="10" fill="rgba(147,51,234,0.2)" />
        <text x="26" y="50" class="ui-font" font-size="24">🎯</text>
        <text x="74" y="38" class="mono-font" font-weight="700" fill="#c4b5fd" font-size="20">Safe (+5)</text>
        <text x="74" y="54" class="ui-font" fill="#93a8c7" font-size="11" font-weight="600">EXAM STATUS</text>
      </g>
    </g>

    <!-- Two Column Layout: Left Subject Breakdown | Right Digital QR Card -->
    <g transform="translate(0, 244)">

      <!-- Left: Subject Breakdown -->
      <g filter="url(#cShadow)">
        <rect width="560" height="340" rx="14" fill="#12213b" stroke="rgba(255,255,255,0.08)" />
        <text x="24" y="34" class="ui-font" font-weight="700" fill="#ffffff" font-size="16">Subject-wise Attendance Progress</text>
        <text x="24" y="52" class="ui-font" fill="#93a8c7" font-size="12">Live metrics vs 75% minimum university requirement</text>

        <!-- Subject 1: Data Structures -->
        <g transform="translate(24, 72)">
          <rect width="512" height="68" rx="10" fill="#1a2c4e" />
          <text x="16" y="24" class="ui-font" font-weight="700" fill="#ffffff" font-size="14">📚 Data Structures &amp; Algorithms</text>
          <rect x="420" y="10" width="76" height="20" rx="10" fill="rgba(46,125,91,0.3)" />
          <text x="430" y="24" class="mono-font" fill="#6de2ad" font-size="11" font-weight="700">92% · Safe</text>
          <!-- Progress bar -->
          <rect x="16" y="36" width="480" height="8" rx="4" fill="#0d1829" />
          <rect x="16" y="36" width="441" height="8" rx="4" fill="url(#greenG)" />
          <text x="16" y="58" class="ui-font" fill="#93a8c7" font-size="11">12 of 13 lectures attended</text>
          <text x="424" y="58" class="mono-font" fill="#6de2ad" font-size="11">✔ Above 75%</text>
        </g>

        <!-- Subject 2: Database Management Systems -->
        <g transform="translate(24, 150)">
          <rect width="512" height="68" rx="10" fill="#1a2c4e" />
          <text x="16" y="24" class="ui-font" font-weight="700" fill="#ffffff" font-size="14">📚 Database Management Systems</text>
          <rect x="420" y="10" width="76" height="20" rx="10" fill="rgba(46,125,91,0.3)" />
          <text x="430" y="24" class="mono-font" fill="#6de2ad" font-size="11" font-weight="700">85% · Safe</text>
          <rect x="16" y="36" width="480" height="8" rx="4" fill="#0d1829" />
          <rect x="16" y="36" width="408" height="8" rx="4" fill="url(#greenG)" />
          <text x="16" y="58" class="ui-font" fill="#93a8c7" font-size="11">11 of 13 lectures attended</text>
          <text x="424" y="58" class="mono-font" fill="#6de2ad" font-size="11">✔ Above 75%</text>
        </g>

        <!-- Subject 3: Computer Networks -->
        <g transform="translate(24, 228)">
          <rect width="512" height="68" rx="10" fill="#1a2c4e" />
          <text x="16" y="24" class="ui-font" font-weight="700" fill="#ffffff" font-size="14">📚 Computer Networks &amp; Security</text>
          <rect x="410" y="10" width="86" height="20" rx="10" fill="rgba(242,169,59,0.3)" />
          <text x="420" y="24" class="mono-font" fill="#ffd56b" font-size="11" font-weight="700">83% · Buffer 1</text>
          <rect x="16" y="36" width="480" height="8" rx="4" fill="#0d1829" />
          <rect x="16" y="36" width="398" height="8" rx="4" fill="url(#amberG)" />
          <text x="16" y="58" class="ui-font" fill="#93a8c7" font-size="11">5 of 6 lectures attended</text>
          <text x="424" y="58" class="mono-font" fill="#ffd56b" font-size="11">✔ Above 75%</text>
        </g>

        <!-- Guidance bar -->
        <g transform="translate(24, 304)">
          <text x="4" y="16" class="ui-font" fill="#6de2ad" font-size="12">💡 Status: All subjects currently satisfy the 75% threshold for university exams.</text>
        </g>
      </g>

      <!-- Right: Digital Smart ID Card -->
      <g transform="translate(584, 0)" filter="url(#cShadow)">
        <rect width="352" height="340" rx="14" fill="#0e1a2f" stroke="rgba(255,255,255,0.12)" />
        <rect x="8" y="8" width="336" height="324" rx="10" fill="none" stroke="rgba(242,169,59,0.4)" stroke-dasharray="4,4" />

        <!-- Card Header -->
        <text x="24" y="34" class="mono-font" fill="#f2a93b" font-size="10" letter-spacing="1">CAMPUS SMART ID</text>
        <text x="24" y="52" class="ui-font" font-weight="700" fill="#ffffff" font-size="14">ABC College of Engineering</text>
        <!-- Chip -->
        <rect x="290" y="22" width="36" height="26" rx="4" fill="url(#amberG)" />
        <line x1="290" y1="35" x2="326" y2="35" stroke="#78350f" />

        <!-- Body -->
        <g transform="translate(24, 68)">
          <rect width="56" height="56" rx="8" fill="#1f3354" stroke="#f2a93b" stroke-width="2" />
          <circle cx="28" cy="22" r="11" fill="#a4bcd9" />
          <path d="M 14 50 C 14 38 42 38 42 50 Z" fill="#a4bcd9" />
          <text x="68" y="18" class="ui-font" font-weight="700" fill="#ffffff" font-size="15">PREMENDU MANNA</text>
          <text x="68" y="34" class="mono-font" fill="#ffd56b" font-size="12">ROLL: 89</text>
          <text x="68" y="48" class="ui-font" fill="#93a8c7" font-size="11">CSE · Semester 5</text>
        </g>

        <!-- QR Code -->
        <g transform="translate(126, 142)">
          <rect width="100" height="100" rx="8" fill="#ffffff" />
          <!-- Big corner blocks -->
          <rect x="10" y="10" width="24" height="24" fill="#0e1a2f" />
          <rect x="14" y="14" width="16" height="16" fill="#ffffff" />
          <rect x="18" y="18" width="8" height="8" fill="#0e1a2f" />

          <rect x="66" y="10" width="24" height="24" fill="#0e1a2f" />
          <rect x="70" y="14" width="16" height="16" fill="#ffffff" />
          <rect x="74" y="18" width="8" height="8" fill="#0e1a2f" />

          <rect x="10" y="66" width="24" height="24" fill="#0e1a2f" />
          <rect x="14" y="70" width="16" height="16" fill="#ffffff" />
          <rect x="18" y="74" width="8" height="8" fill="#0e1a2f" />

          <!-- modules -->
          <rect x="42" y="12" width="6" height="6" fill="#0e1a2f" />
          <rect x="52" y="20" width="6" height="14" fill="#0e1a2f" />
          <rect x="42" y="40" width="16" height="6" fill="#0e1a2f" />
          <rect x="64" y="44" width="12" height="6" fill="#0e1a2f" />
          <rect x="40" y="54" width="8" height="8" fill="#0e1a2f" />
          <rect x="54" y="68" width="12" height="8" fill="#0e1a2f" />
          <rect x="72" y="60" width="6" height="12" fill="#0e1a2f" />
          <rect x="80" y="76" width="8" height="8" fill="#0e1a2f" />
          <rect x="42" y="82" width="18" height="6" fill="#0e1a2f" />
        </g>

        <!-- Actions -->
        <g transform="translate(68, 260)">
          <rect width="216" height="34" rx="8" fill="#f2a93b" />
          <text x="44" y="22" class="ui-font" font-weight="700" fill="#0e1a2f" font-size="12">⬇ Download PNG ID Card</text>
        </g>
        <text x="176" y="314" text-anchor="middle" class="mono-font" fill="#93a8c7" font-size="10">HOLD UP TO PROFESSOR CAMERA</text>
      </g>
    </g>
  </g>
</svg>
